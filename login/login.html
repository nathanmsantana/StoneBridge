<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | StoneBridge</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="logotipo.png">
</head>
<body>
    <main class="container">
        <div class="login-card">
            <a href="inicio/inicio.html">
                <img src="logotipoheader.png" alt="StoneBridge" class="logo">
            </a>
            <h1>Bem-vindo de volta!</h1>
            <p class="subtitulo">Entre na sua conta para continuar.</p>
            <form>
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
                <div class="esqueci">
                    <a href="esquecisenha/esquecisenha.html">Esqueci minha senha</a>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p class="cadastro">
                Ainda não tem uma conta?
                <a href="cadastro/escolhadecadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>
</body>
</html>
